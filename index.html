<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarjeta de Luna</title>
<!-- Tipografías femeninas desde Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;500&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">

<style>
/* ===== SELECTORES ===== */

/* Selector universal - reset básico */
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}

/* Selector de elemento */
body {
/* Fondo degradado en gamas violeta */
background: linear-gradient(135deg, #2d1b4e 0%, #4a148c 25%, #7c4dff 50%, #b388ff 75%, #e1bee7 100%);
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
font-family: 'Poppins', sans-serif;
}

/* Selector de clase */
.contenedor {
display: flex;
justify-content: center;
align-items: center;
padding: 40px;
}

/* ===== LA TARJETA ===== */
.tarjeta {
/* ===== WIDTH Y HEIGHT ===== */
width: 420px;
/* height automático según contenido */

/* ===== PADDING ===== */
padding: 50px 40px;

/* ===== MARGIN ===== */
margin: 20px;

/* Fondo con transparencia */
background: rgba(255, 255, 255, 0.15);
backdrop-filter: blur(15px);

/* ===== BORDES ===== */
border-radius: 30px;
border: 2px solid rgba(255, 255, 255, 0.3);
border-bottom: 4px solid #ffd700;

/* Sombra elegante */
box-shadow:
0 25px 50px rgba(0, 0, 0, 0.3),
0 0 100px rgba(179, 136, 255, 0.3),
inset 0 1px 0 rgba(255, 255, 255, 0.2);

text-align: center;
position: relative;
overflow: hidden;
}

/* Decoración superior amarilla */
.tarjeta::before {
content: '';
position: absolute;
top: 0;
left: 0;
right: 0;
height: 5px;
background: linear-gradient(90deg, #ffd700, #ffeb3b, #ffd700);
}

/* ===== PROPIEDADES DE TEXTO ===== */

/* Título principal */
.titulo {
font-family: 'Dancing Script', cursive;
font-size: 42px;
color: #ffd700;
text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
margin-bottom: 25px;
letter-spacing: 1px;
}

/* Círculo decorativo para avatar */
.avatar-contenedor {
width: 120px;
height: 120px;
margin: 0 auto 25px auto;
border-radius: 50%;
border: 4px solid #ffd700;
padding: 5px;
background: linear-gradient(135deg, #7c4dff, #b388ff);
box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
}

.avatar {
width: 100%;
height: 100%;
border-radius: 50%;
background: linear-gradient(135deg, #e1bee7, #ce93d8);
display: flex;
align-items: center;
justify-content: center;
font-size: 50px;
}

/* Nombre */
.nombre {
font-family: 'Playfair Display', serif;
font-size: 32px;
font-weight: 700;
color: #ffffff;
margin-bottom: 8px;
text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
letter-spacing: 0.5px;
}

/* Subtítulo decorativo */
.subtitulo {
font-family: 'Poppins', sans-serif;
font-size: 13px;
font-weight: 300;
color: #e1bee7;
text-transform: uppercase;
letter-spacing: 4px;
margin-bottom: 30px;
}

/* Línea decorativa */
.linea {
width: 60px;
height: 3px;
background: linear-gradient(90deg, transparent, #ffd700, transparent);
margin: 0 auto 30px auto;
border-radius: 2px;
}

/* Descripción */
.descripcion {
font-family: 'Poppins', sans-serif;
font-size: 16px;
font-weight: 300;
line-height: 1.8;
color: rgba(255, 255, 255, 0.9);
text-align: center;
padding: 0 10px;
}

/* Énfasis en palabras clave */
.descripcion strong {
color: #ffd700;
font-weight: 500;
}

/* Iconos de intereses */
.intereses {
margin-top: 30px;
display: flex;
justify-content: center;
gap: 20px;
}

.interes-item {
width: 50px;
height: 50px;
border-radius: 50%;
background: rgba(255, 215, 0, 0.15);
border: 2px solid rgba(255, 215, 0, 0.4);
display: flex;
align-items: center;
justify-content: center;
font-size: 22px;
transition: all 0.3s ease;
}

.interes-item:hover {
background: rgba(255, 215, 0, 0.3);
transform: translateY(-5px);
box-shadow: 0 8px 20px rgba(255, 215, 0, 0.2);
}

/* Pie de tarjeta */
.pie {
margin-top: 25px;
font-family: 'Dancing Script', cursive;
font-size: 18px;
color: #b388ff;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 480px) {
.tarjeta {
width: 90%;
padding: 35px 25px;
margin: 15px;
}

.titulo {
font-size: 34px;
}

.nombre {
font-size: 26px;
}
}
</style>
</head>
<body>

<div class="contenedor">
<div class="tarjeta">
<!-- Título de la tarjeta -->
<h1 class="titulo">Tarjeta de Luna</h1>

<!-- Avatar decorativo -->
<div class="avatar-contenedor">
<div class="avatar">🌙</div>
</div>

<!-- Nombre -->
<h2 class="nombre">Luna Van Opstal</h2>
<p class="subtitulo">✨ Mi mundo ✨</p>

<!-- Línea decorativa -->
<div class="linea"></div>

<!-- Descripción -->
<p class="descripcion">
Me gusta el <strong>voley</strong>, <strong>dormir</strong>,
la <strong>música</strong> y estar con mis <strong>amigas</strong>. 🌸
</p>

<!-- Iconos de intereses -->
<div class="intereses">
<div class="interes-item" title="Voley">🏐</div>
<div class="interes-item" title="Dormir">😴</div>
<div class="interes-item" title="Música">🎵</div>
<div class="interes-item" title="Amigas">👯‍♀️</div>
</div>

<p class="pie">Con cariño, Luna</p>
</div>
</div>

</body>
</html>
